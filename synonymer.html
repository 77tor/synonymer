<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synonym Generator</title>
    
    <!-- PDF biblioteker -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Importerer datagrunnlaget ditt -->
    <script src="synonymer.js"></script>

    <style>
        :root {
            --sidebar-bg: #1e2b37;
            --sidebar-header: #15202b;
            --page-bg: #e2ece9;
            --btn-green: #2ecc71;
            --btn-blue: #3498db;
            --btn-red: #e74c3c;
            --frame-color: #2e7d32;
        }

        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            background-color: var(--page-bg);
            min-height: 100vh;
        }

        /* Sidepanel (Mørk Meny) */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            padding: 0;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .sidebar-header {
            background-color: var(--sidebar-header);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .menu-container {
            position: relative;
        }

        .hamburger {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger span {
            width: 20px;
            height: 2px;
            background-color: #fff;
            border-radius: 2px;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            border-radius: 6px;
            width: 200px;
            z-index: 100;
            padding: 8px 0;
        }

        .dropdown-menu.show { display: block; }

        .dropdown-menu a {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            gap: 10px;
            font-size: 13px;
        }

        .dropdown-menu a:hover { background-color: #f0f0f0; }
        .menu-icon { width: 18px; height: 18px; }

        .sidebar-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }

        textarea {
            width: 100%;
            height: 90px;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            font-size: 13px;
            resize: vertical;
            background: #fff;
            color: #000;
        }

        .control-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #e0e0e0;
        }

        /* Brytere (Toggle switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #7f8c8d;
            transition: .2s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px; width: 14px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(18px); }

        select, input[type="text"] {
            padding: 5px 8px;
            border-radius: 4px;
            border: none;
            width: 50%;
            font-size: 12px;
        }

        /* Knapper */
        .btn-generate {
            background-color: var(--btn-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .btn-generate:hover { background-color: #27ae60; }

        .btn-group {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }

        .action-btn {
            border: none;
            color: white;
            padding: 9px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 10px;
            text-transform: uppercase;
        }

        .btn-pdf { background-color: var(--btn-blue); flex: 2; }
        .btn-reset { background-color: var(--btn-red); flex: 1; }

        /* Hovedområde (A4-ark) */
        .main-content {
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        #capture-area {
            background: white;
            width: 210mm;
            min-height: 297mm;
            padding: 15mm;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 3px solid var(--frame-color);
            border-radius: 4px;
        }

        .page-title {
            font-size: 26px;
            margin: 10px 0 25px 0;
            text-align: center;
            color: var(--frame-color);
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        /* Synonym Tabell */
        .synonym-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .synonym-table td {
            padding: 12px 10px;
            font-size: 18px;
            border-bottom: 1px dashed #ccc;
        }

        .ord-kolonne {
            font-weight: bold;
            width: 35%;
        }

        .linje-kolonne {
            width: 40%;
            border-bottom: 2px solid #333 !important;
        }

        .fasit-kolonne {
            width: 20%;
            color: #d63031;
            font-weight: bold;
            display: none;
        }

        .show-fasit .fasit-kolonne {
            display: table-cell;
        }

        .uppercase-mode {
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <div class="menu-container">
            <div class="hamburger" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div id="myDropdown" class="dropdown-menu">
                <a href="https://77tor.github.io/bingo/" target="_self"><img src="bingo_02.png" class="menu-icon"> Bingo</a>
                <a href="https://77tor.github.io/finn_ordet/" target="_self"><img src="finn_ordet_01.svg" class="menu-icon"> Finn ordet</a>
                <a href="https://77tor.github.io/gitter/" target="_self"><img src="gitter_02.png" class="menu-icon"> Gitter-ord</a>
                <a href="https://77tor.github.io/les_og_skriv/" target="_self"><img src="les_skriv.png" class="menu-icon"> Les og skriv</a>
                <a href="https://77tor.github.io/ord-sok/" target="_self"><img src="ord-sok.png" class="menu-icon"> Ordsøk</a>
                <a href="https://77tor.github.io/puslehistorier/" target="_self"><img src="pusle_02.png" class="menu-icon"> Puslehistorier</a>
                <a href="https://77tor.github.io/Silhuettord/" target="_self"><img src="silhuett-ord_05.png" class="menu-icon"> Silhuett-ord</a>
                <a href="https://77tor.github.io/Stavelser/" target="_self"><img src="stavelser_01.png" class="menu-icon"> Stavelser</a>
            </div>
        </div>
        <h2>Synonym-Generator</h2>
    </div>    
    
    <div class="sidebar-content">
        <textarea id="wordInput" placeholder="Skriv ord/synonymer her (valgfritt)..."></textarea>
        
        <div class="control-item">
            <span>Bare STORE bokstaver</span>
            <label class="switch"><input type="checkbox" id="toggleCase" onchange="updateView()"><span class="slider"></span></label>
        </div>
        
        <div class="control-item">
            <span>Visuelt tema</span>
            <select id="temaVelger" onchange="oppdaterTema()">
                <option value="theme-skog">Småkryp (Grønn)</option>
                <option value="theme-sol">Solskinn (Gul)</option>
                <option value="theme-standard">Standard (Blå)</option>
            </select>
        </div>

        <div class="control-item">
            <span>Overskrift</span>
            <input type="text" id="titleInput" value="Synonymoppgave" oninput="oppdaterOverskrift()">
        </div>

        <div class="control-item">
            <span style="color: #ff7675;">Vis fasit</span>
            <label class="switch"><input type="checkbox" id="toggleFasit" onchange="updateView()"><span class="slider"></span></label>
        </div>

        <button class="btn-generate" onclick="generate()">LAG SYNONYMARK</button>

        <div class="btn-group">
            <button class="action-btn btn-pdf" onclick="downloadFullImage()">SKRIV UT / LAGRE PDF</button>
            <button class="action-btn btn-reset" onclick="resetForm()">NULLSTILL</button>
        </div>
    </div>
</div>

<div class="main-content">
    <div id="capture-area">
        <h1 id="pageTitle" class="page-title">Synonymoppgave</h1>
        
        <table class="synonym-table">
            <tbody id="synonymOutput">
                <!-- Synonym-oppgaver genereres her -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function updateView() {
        const body = document.body;
        if (document.getElementById('toggleFasit').checked) body.classList.add('show-fasit');
        else body.classList.remove('show-fasit');

        if (document.getElementById('toggleCase').checked) body.classList.add('uppercase-mode');
        else body.classList.remove('uppercase-mode');
    }

    function oppdaterTema() {
        const tema = document.getElementById('temaVelger').value;
        const root = document.documentElement;
        if (tema === 'theme-skog') {
            root.style.setProperty('--frame-color', '#2e7d32');
            root.style.setProperty('--page-bg', '#e2ece9');
        } else if (tema === 'theme-sol') {
            root.style.setProperty('--frame-color', '#f39c12');
            root.style.setProperty('--page-bg', '#fef9e7');
        } else {
            root.style.setProperty('--frame-color', '#2980b9');
            root.style.setProperty('--page-bg', '#ebf5fb');
        }
    }

    function oppdaterOverskrift() {
        const inputFelt = document.getElementById('titleInput');
        document.getElementById('pageTitle').textContent = inputFelt.value.trim() === "" ? "Synonymoppgave" : inputFelt.value;
    }

    function generate() {
        let dataKilde = [];

        // Henter manuell tekst om bruker har skrevet noe
        const manuellInput = document.getElementById('wordInput').value.trim();
        if (manuellInput.length > 0) {
            const linjer = manuellInput.split('\n');
            linjer.forEach(l => {
                const deler = l.split(/[:=-]/);
                if (deler.length >= 2) {
                    dataKilde.push({ ord: deler[0].trim(), synonym: deler[1].trim() });
                }
            });
        } 
        
        // Henter fra synonymer.js
        if (dataKilde.length === 0 && typeof synonymData !== 'undefined') {
            dataKilde = [...synonymData];
        }

        if (dataKilde.length === 0) {
            alert("Kunne ikke laste ord fra synonymer.js.");
            return;
        }

        // Blander ordene
        dataKilde.sort(() => 0.5 - Math.random());
        const utvalg = dataKilde.slice(0, 10);

        let html = "";
        utvalg.forEach((item, index) => {
            html += `
                <tr>
                    <td style="width: 30px; font-weight: bold;">${index + 1}.</td>
                    <td class="ord-kolonne">${item.ord}</td>
                    <td class="linje-kolonne"></td>
                    <td class="fasit-kolonne">${item.synonym}</td>
                </tr>
            `;
        });

        document.getElementById('synonymOutput').innerHTML = html;
        updateView();
    }

    function resetForm() {
        document.getElementById('wordInput').value = "";
        document.getElementById('synonymOutput').innerHTML = "";
        document.getElementById('toggleCase').checked = false;
        document.getElementById('toggleFasit').checked = false;
        document.getElementById('titleInput').value = "Synonymoppgave";
        oppdaterOverskrift();
        updateView();
    }

    function downloadFullImage() {
        const element = document.getElementById('capture-area');
        if (document.getElementById('synonymOutput').innerHTML === "") {
            alert("Generer en oppgave først!");
            return;
        }

        html2canvas(element, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL("image/png");
            const targetjsPDF = window.jspdf.jsPDF;
            const pdf = new targetjsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
            
            const pdfBredde = pdf.internal.pageSize.getWidth();
            const pdfHøyde = pdf.internal.pageSize.getHeight();
            
            pdf.addImage(imgData, 'PNG', 0, 0, pdfBredde, pdfHøyde);
            pdf.save('synonym_oppgave.pdf');
        });
    }

    function toggleMenu() {
        document.getElementById("myDropdown").classList.toggle("show");
    }

    window.onclick = function(event) {
        if (!event.target.closest('.menu-container')) {
            var dropdowns = document.getElementsByClassName("dropdown-menu");
            for (var i = 0; i < dropdowns.length; i++) {
                var openDropdown = dropdowns[i];
                if (openDropdown.classList.contains('show')) {
                    openDropdown.classList.remove('show');
                }
            }
        }
    }

    // Kjør ved oppstart
    generate();
</script>
</body>
</html>
